[project]
name = "fleet-kit"
version = "0.4.0"
description = "Development tooling for the fleet-kit Claude Code plugin (hooks, token report, tests)"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "mypy>=1.11",
]

[tool.uv]
package = false
default-groups = ["dev"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["hooks", "scripts"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["hooks/context_ceiling.py", "hooks/wait_cap.py", "scripts/session_tokens.py", "tests/test_vendored_kit.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
strict = true
files = [
  "scripts/fleet_report.py",
  "scripts/first_context.py",
  "tests/test_fleet_report.py",
  "tests/test_first_context.py",
  "tests/test_plugin.py",
  "scripts/gates",
  "scripts/fleet_stop.py",
  "tests/test_fleet_stop.py",
  "scripts/fleet_slot.py",
  "scripts/fleet_agent.py",
  "tests/test_fleet_slot.py",
  "tests/test_fleet_agent.py",
  "scripts/fleet_allocate.py",
  "tests/test_fleet_allocate.py",
  "tests/test_fleet_allocate_io.py",
  "tests/test_evasion_write_guard.py",
  "tests/test_evasion_kit.py",
  "tests/test_evasion_silent_skips.py",
  "tests/test_evasion_audit_greps.py",
  "tests/test_evasion_file_size.py",
  "tests/test_evasion_obligations.py",
  "tests/test_evasion_duplication.py",
  "tests/test_evasion_ratchet.py",
  "tests/test_evasion_verdict.py",
]
mypy_path = "scripts:hooks"

[tool.ruff.lint.per-file-ignores]
# The evasion kits hold long one-line code samples as data.
"tests/test_evasion_*.py" = ["E501", "UP031"]
# The module docstrings are the gates' documentation and run to 120 columns.
"scripts/gates/*.py" = ["E501"]
# The new hooks' and the stop script's module docstrings are their documentation.
"hooks/write_guard.py" = ["E501"]
"hooks/stop_line.py" = ["E501"]
"scripts/fleet_stop.py" = ["E501"]
"scripts/fleet_slot.py" = ["E501"]
"scripts/fleet_agent.py" = ["E501"]
"scripts/fleet_allocate.py" = ["E501"]
